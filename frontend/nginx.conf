server {
    listen 80;
    server_name localhost;

    # The static frontend itself
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to the backend, reached by its COMPOSE SERVICE NAME.
    # "backend" resolves via Docker's built-in DNS — no IP address, no
    # hardcoding, works identically on every machine that runs this Compose
    # file. Trailing slashes on BOTH lines strip the /api/ prefix, so
    # /api/enhance becomes http://backend:3000/enhance.
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 20M;
    }

    # Enhanced images themselves are served by the backend from its volume
    location /enhanced/ {
        proxy_pass http://backend:3000/enhanced/;
    }
}
